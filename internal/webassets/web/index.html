<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>webterm</title>
  <!-- ВАЖНО: ставим флаг синхронно, до main.js — иначе его автозапуск
       успеет сработать раньше, чем we-bridge.js его перехватит -->
  <script>window.__WE_MANAGED = true;</script>
  <link rel="stylesheet" href="vendor/fonts.css" />
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="term-wrap" id="termWrap">
    <div id="terminal"></div>
  </div>

  <!-- едва заметный хэндл у края экрана — тянет выезжающую панель -->
  <button class="drawer-handle" id="drawerHandle" data-i18n-title="settings">
    <span class="status-dot" id="statusDot"></span>
  </button>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-row status-row">
      <span class="status-dot" id="statusDot2"></span>
      <span id="statusText" data-i18n="drawerConnecting"></span>
    </div>

    <label class="drawer-row">
      <span data-i18n="dTheme"></span>
      <select id="settingTheme"></select>
    </label>

    <label class="drawer-row">
      <span data-i18n="dFont"></span>
      <select id="settingFontFamily"></select>
    </label>

    <label class="drawer-row">
      <span data-i18n="dFontSize"></span>
      <div class="stepper">
        <button id="fontMinus">−</button>
        <span id="fontValue">14</span>
        <button id="fontPlus">+</button>
      </div>
    </label>

    <label class="drawer-row">
      <span data-i18n="dOpacity"></span>
      <input id="settingOpacity" type="range" min="0" max="100" value="72" />
    </label>

    <label class="drawer-row">
      <span data-i18n="dCursor"></span>
      <select id="settingCursor">
        <option value="bar" data-i18n="cursorBar"></option>
        <option value="block" data-i18n="cursorBlock"></option>
        <option value="underline" data-i18n="cursorUnderline"></option>
      </select>
    </label>

    <div class="drawer-row search-row">
      <input id="searchInput" type="text" data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
      <button id="searchPrev" data-i18n-title="searchPrev">↑</button>
      <button id="searchNext" data-i18n-title="searchNext">↓</button>
      <span class="search-count" id="searchCount"></span>
    </div>
  </div>

  <script type="module" src="we-bridge.js"></script>
</body>
</html>
